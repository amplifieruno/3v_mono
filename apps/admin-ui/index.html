<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ITAP console" />
    <title>ITAP Console</title>
    <!--
      Pre-paint theme bootstrap (buro). It must run before the first paint, so it
      stays an inline script ahead of the module entry. The key is a literal and
      must equal THEME_STORAGE_KEY from @burojs/ui-shadcn. setTheme('system')
      removes the key, so "neither dark nor light" means "follow the OS".
    -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('buro-theme');
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* blocked storage is not a reason to fail to render */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
