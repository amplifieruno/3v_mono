type Mutation {
  switch_organization(organization_id: uuid!): OrgToken!
  invite_member(email: String!, role: String = "admin"): Invitation!
  accept_invitation(token: String!): AcceptedInvitation!
  open_file(file_id: uuid!): FileUrl!
  delete_file(file_id: uuid!): DeletedFile!
  upload_profile_document(
    profile_id: uuid!
    kind: String!
    title: String!
    file_name: String!
    mime_type: String!
    content_base64: String!
  ): ProfileDocument!
}

type OrgToken {
  access_token: String!
  expires_at: timestamptz!
  organization_id: uuid!
  role: String!
}

type Invitation {
  invitation_id: uuid!
  token: String!
  expires_at: timestamptz!
}

type AcceptedInvitation {
  organization_id: uuid!
}

type FileUrl {
  url: String!
  expires_at: timestamptz!
}

type DeletedFile {
  file_id: uuid!
}

type ProfileDocument {
  document_id: uuid!
  file_id: uuid!
}
