type Mutation {
  switch_organization(organization_id: uuid!): OrgToken!
  invite_member(email: String!, role: String = "admin"): Invitation!
  accept_invitation(token: String!): AcceptedInvitation!
  open_file(file_id: uuid!): FileUrl!
  delete_file(file_id: uuid!): DeletedFile!
  upload_profile_document(
    profile_id: uuid!
    kind: String!
    title: String!
    file_name: String!
    mime_type: String!
    content_base64: String!
  ): ProfileDocument!
  enroll_face(profile_id: uuid!, file_ids: [uuid!]!): EnrollmentResult!
  create_identity_from_photos(file_ids: [uuid!]!, attributes: jsonb): EnrollmentResult!
  add_identity_photos(identity_id: uuid!, file_ids: [uuid!]!): EnrollmentResult!
  recognition_start(device_id: uuid!): RecognitionStatus!
  recognition_stop(device_id: uuid!): RecognitionStatus!
  evaluate_segment(segment_id: uuid!): SegmentEvaluation!
  search_faces(
    search_type: String!
    image_file_id: uuid
    filters: jsonb
    threshold: Float
    max_results: Int
    fuzzy: Boolean
  ): SearchResult!
}

type Query {
  recognition_status(device_id: uuid!): RecognitionStatus!
  preview_segment(target: String!, conditions: jsonb!, limit: Int): SegmentPreview!
}

type OrgToken {
  access_token: String!
  expires_at: timestamptz!
  organization_id: uuid!
  role: String!
}

type Invitation {
  invitation_id: uuid!
  token: String!
  expires_at: timestamptz!
}

type AcceptedInvitation {
  organization_id: uuid!
}

type FileUrl {
  url: String!
  expires_at: timestamptz!
}

type DeletedFile {
  file_id: uuid!
}

type ProfileDocument {
  document_id: uuid!
  file_id: uuid!
}

type EnrollmentResult {
  identity_id: uuid!
  identity_code: String!
  photos_added: Int!
  templates: Int!
  rejected: [RejectedPhoto!]!
}

type RejectedPhoto {
  file_id: uuid!
  reason: String!
}

type RecognitionStatus {
  device_id: uuid!
  enabled: Boolean!
  running: Boolean!
  fps: Int!
  frames_processed: Int!
  frames_dropped: Int!
  faces_detected: Int!
  detections: Int!
  last_frame_at: timestamptz
  last_error: String
}

type SegmentPreview {
  count: Int!
  sample_ids: [uuid!]!
  sample_labels: [String!]!
}

type SegmentEvaluation {
  segment_id: uuid!
  added: Int!
  removed: Int!
  member_count: Int!
  evaluated_at: timestamptz!
  stale: Boolean!
}

type SearchResult {
  search_request_id: uuid!
  status: String!
  results_count: Int!
  top_confidence: Float
  duration_ms: Int!
  face_count: Int
  error: String
}
