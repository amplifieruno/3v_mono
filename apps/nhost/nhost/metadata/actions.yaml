actions:
  - name: switch_organization
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/switch_organization'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: user
    comment: Checks an active membership and returns a short-lived organization token (§4.3)
  - name: invite_member
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/invite_member'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Creates a pending invitation and returns its one-time token
  - name: accept_invitation
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/accept_invitation'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: user
    comment: Accepts an invitation addressed to the caller's email and creates or reactivates the membership
  - name: open_file
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/open_file'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Returns a short-lived download URL for a file in the session organization bucket (or org-logos); audits sensitive kinds
  - name: delete_file
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/delete_file'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Deletes a file from the session organization bucket
  - name: upload_profile_document
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/upload_profile_document'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 60
    permissions:
      - role: org_admin
    comment: Stores a profile document (max 10 MB) in the organization bucket as a sensitive file and records it
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: OrgToken
    - name: Invitation
    - name: AcceptedInvitation
    - name: FileUrl
    - name: DeletedFile
    - name: ProfileDocument
  scalars: []
