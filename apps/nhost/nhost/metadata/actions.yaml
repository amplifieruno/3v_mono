actions:
  - name: switch_organization
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/switch_organization'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: user
    comment: Checks an active membership and returns a short-lived organization token (§4.3)
  - name: invite_member
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/invite_member'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Creates a pending invitation and returns its one-time token
  - name: accept_invitation
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/accept_invitation'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: user
    comment: Accepts an invitation addressed to the caller's email and creates or reactivates the membership
  - name: open_file
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/open_file'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Returns a short-lived download URL for a file in the session organization bucket (or org-logos); audits sensitive kinds
  - name: delete_file
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/delete_file'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Deletes a file from the session organization bucket
  - name: upload_profile_document
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/upload_profile_document'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 60
    permissions:
      - role: org_admin
    comment: Stores a profile document (max 10 MB) in the organization bucket as a sensitive file and records it
  - name: enroll_face
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/enroll_face'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 120
    permissions:
      - role: org_admin
    comment: Adds face photos to the profile's identity (reuses or links a matching one, never duplicates); duplicate_identity when the face belongs to another profile
  - name: create_identity_from_photos
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/create_identity_from_photos'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 120
    permissions:
      - role: org_admin
    comment: Creates an unlinked identity from face photos; duplicate_identity when the face is already known
  - name: add_identity_photos
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/add_identity_photos'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 120
    permissions:
      - role: org_admin
    comment: Adds face photos to an identity; photos matching a different identity are rejected as conflicting_identity
  - name: recognition_start
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/recognition_start'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Enables live recognition on a camera of the organization (recognition_enabled) and returns the session status
  - name: recognition_stop
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/recognition_stop'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: org_admin
    comment: Disables live recognition on a camera of the organization and returns the session status
  - name: recognition_status
    definition:
      kind: synchronous
      handler: '{{BACKEND_URL}}/hasura/actions/recognition_status'
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
      type: query
    permissions:
      - role: org_admin
    comment: Live recognition counters of a camera of the organization (frames, faces, detections, last error)
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: OrgToken
    - name: Invitation
    - name: AcceptedInvitation
    - name: FileUrl
    - name: DeletedFile
    - name: ProfileDocument
    - name: EnrollmentResult
    - name: RejectedPhoto
    - name: RecognitionStatus
  scalars: []
