- name: close_stale_sessions
  webhook: "{{BACKEND_URL}}/hasura/events/close_stale_sessions"
  schedule: "*/2 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
    tolerance_seconds: 120
  headers:
    - name: x-action-secret
      value_from_env: ACTION_SECRET
  comment: Close active tracking sessions idle longer than the tracking timeout; clear their occupancy
- name: device_health_check
  webhook: "{{BACKEND_URL}}/hasura/events/device_health_check"
