- name: device_health_check
  webhook: "{{BACKEND_URL}}/hasura/events/device_health_check"
  schedule: "* * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
    tolerance_seconds: 120
  headers:
    - name: x-action-secret
      value_from_env: ACTION_SECRET
  comment: "Probe the stream-server per camera: metrics, health_status, last_seen_at, device_events"
- name: heartbeat
  webhook: "{{BACKEND_URL}}/hasura/events/heartbeat"
  schedule: "*/5 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
    tolerance_seconds: 21600
  headers:
    - name: x-action-secret
      value_from_env: ACTION_SECRET
  comment: Cron pipeline health check; the backend handler writes nothing
