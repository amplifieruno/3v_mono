table:
  schema: itap
  name: device_areas
configuration:
  custom_name: device_areas
object_relationships:
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          area_id: id
  - name: device
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: devices
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          device_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - device_id
        - facility_id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - created_at
        - device_id
        - facility_id
        - id
        - organization_id
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns: []
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
