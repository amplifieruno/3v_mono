table:
  schema: itap
  name: incident_note_files
configuration:
  custom_name: incident_note_files
object_relationships:
  - name: file
    using:
      manual_configuration:
        remote_table:
          schema: storage
          name: files
        column_mapping:
          file_id: id
  - name: note
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incident_notes
        column_mapping:
          organization_id: organization_id
          note_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - file_id
        - note_id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - file_id
        - id
        - note_id
        - organization_id
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns: []
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
