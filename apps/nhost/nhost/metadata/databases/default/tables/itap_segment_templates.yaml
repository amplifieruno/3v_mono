table:
  schema: itap
  name: segment_templates
configuration:
  custom_name: segment_templates
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: segments
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: segments
        column_mapping:
          organization_id: organization_id
          id: template_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - category
        - conditions
        - description
        - name
        - target
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - category
        - conditions
        - created_at
        - description
        - id
        - is_system
        - name
        - organization_id
        - target
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - category
        - conditions
        - description
        - name
      filter:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - is_system:
              _eq: false
      check:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - is_system:
              _eq: false
delete_permissions:
  - role: org_admin
    permission:
      filter:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - is_system:
              _eq: false
