table:
  schema: itap
  name: access_grants
configuration:
  custom_name: access_grants
object_relationships:
  - name: access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          access_point_id: id
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          area_id: id
  - name: granted_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          granted_by: user_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          profile_id: id
  - name: revoked_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          revoked_by: user_id
array_relationships:
  - name: access_decisions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_decisions
        column_mapping:
          organization_id: organization_id
          id: grant_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - profile_id
        - area_id
        - access_point_id
        - valid_from
        - valid_until
        - single_use
        - reason
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - access_point_id
        - area_id
        - created_at
        - granted_by
        - id
        - organization_id
        - profile_id
        - reason
        - revoke_reason
        - revoked_at
        - revoked_by
        - single_use
        - updated_at
        - used_at
        - valid_from
        - valid_until
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
