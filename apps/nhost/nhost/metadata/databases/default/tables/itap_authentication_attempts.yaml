table:
  schema: itap
  name: authentication_attempts
configuration:
  custom_name: authentication_attempts
object_relationships:
  - name: access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          access_point_id: id
  - name: application
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: client_applications
        column_mapping:
          organization_id: organization_id
          application_id: id
  - name: claimed_identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          claimed_identity_id: id
  - name: evidence_file
    using:
      manual_configuration:
        remote_table:
          schema: storage
          name: files
        column_mapping:
          evidence_file_id: id
  - name: matched_identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          matched_identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          profile_id: id
  - name: reviewed_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          reviewed_by: user_id
  - name: session
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: authentication_sessions
        column_mapping:
          organization_id: organization_id
          session_id: id
array_relationships:
  - name: auth_sequence_digests
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: auth_sequence_digests
        column_mapping:
          organization_id: organization_id
          id: attempt_id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - access_point_id
        - application_id
        - attack_details
        - attack_outcome
        - attempt_no
        - attempted_at
        - claimed_identity_id
        - comparison_ms
        - comparison_score
        - confidence
        - created_at
        - device_ref
        - evidence_file_id
        - failure_reason
        - id
        - ip
        - latency_ms
        - matched_identity_id
        - mode
        - model_version
        - organization_id
        - outcome
        - population_scope
        - population_size
        - profile_id
        - quality
        - retrieval_candidates
        - retrieval_hit
        - retrieval_ms
        - review_note
        - review_status
        - reviewed_at
        - reviewed_by
        - sequence_digest
        - session_id
        - step
        - threshold_used
        - user_agent
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
