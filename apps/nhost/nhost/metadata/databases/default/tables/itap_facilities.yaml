table:
  schema: itap
  name: facilities
configuration:
  custom_name: facilities
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: access_points
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: area_occupancy
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: area_occupancy
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: areas
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: detections
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: detections
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: devices
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: devices
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: event_rule_version_scopes
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: event_rule_version_scopes
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: events
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: events
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: floor_plans
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: floor_plans
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: identity_locations
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_locations
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: incidents
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incidents
        column_mapping:
          organization_id: organization_id
          id: facility_id
  - name: tracking_sessions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          id: facility_id
computed_fields:
  - name: areas_count
    definition:
      function:
        schema: itap
        name: facility_areas_count
  - name: current_occupancy
    definition:
      function:
        schema: itap
        name: facility_current_occupancy
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - address
        - contact
        - custom_fields
        - description
        - latitude
        - longitude
        - name
        - operating_hours
        - status
        - timezone
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - address
        - code
        - contact
        - created_at
        - custom_fields
        - description
        - id
        - latitude
        - longitude
        - name
        - number
        - operating_hours
        - organization_id
        - status
        - timezone
        - updated_at
      computed_fields:
        - areas_count
        - current_occupancy
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - address
        - contact
        - custom_fields
        - description
        - latitude
        - longitude
        - name
        - operating_hours
        - status
        - timezone
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
