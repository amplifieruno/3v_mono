table:
  schema: itap
  name: notification_deliveries
configuration:
  custom_name: notification_deliveries
object_relationships:
  - name: digest
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_deliveries
        column_mapping:
          organization_id: organization_id
          digested_into: id
  - name: escalation_step
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: escalation_policy_steps
        column_mapping:
          organization_id: organization_id
          escalation_step_id: id
  - name: incident
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incidents
        column_mapping:
          organization_id: organization_id
          incident_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: recipient_user
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          recipient_user_id: user_id
  - name: report
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: reports
        column_mapping:
          organization_id: organization_id
          report_id: id
  - name: rule
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_rules
        column_mapping:
          organization_id: organization_id
          rule_id: id
  - name: subscription
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_subscriptions
        column_mapping:
          organization_id: organization_id
          subscription_id: id
array_relationships:
  - name: digest_items
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_deliveries
        column_mapping:
          organization_id: organization_id
          id: digested_into
select_permissions:
  - role: org_admin
    permission:
      columns:
        - acknowledged_at
        - attempts
        - channel
        - content
        - created_at
        - deliver_after
        - delivered_at
        - digested_into
        - error
        - escalation_cycle
        - escalation_step_id
        - event_id
        - id
        - incident_id
        - organization_id
        - priority
        - recipient_address
        - recipient_key
        - recipient_user_id
        - report_id
        - rule_id
        - sent_at
        - status
        - subscription_id
      filter:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - _or:
              - subscription_id:
                  _is_null: true
              - recipient_user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
event_triggers:
  - name: send_delivery
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 5
      interval_sec: 15
      timeout_sec: 30
    webhook: "{{BACKEND_URL}}/hasura/events/send_delivery"
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
