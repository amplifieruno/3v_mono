table:
  schema: itap
  name: on_call_schedules
configuration:
  custom_name: on_call_schedules
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: escalation_policy_steps
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: escalation_policy_steps
        column_mapping:
          organization_id: organization_id
          id: on_call_schedule_id
  - name: on_call_schedule_members
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: on_call_schedule_members
        column_mapping:
          organization_id: organization_id
          id: schedule_id
computed_fields:
  - name: on_call_user_id
    definition:
      function:
        schema: itap
        name: on_call_schedule_on_call_user_id
  - name: shift_ends_at
    definition:
      function:
        schema: itap
        name: on_call_schedule_shift_ends_at
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - description
        - name
        - rotation_start_at
        - shift_length_hours
        - timezone
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - description
        - id
        - name
        - organization_id
        - rotation_start_at
        - shift_length_hours
        - timezone
        - updated_at
      computed_fields:
        - on_call_user_id
        - shift_ends_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - description
        - name
        - rotation_start_at
        - shift_length_hours
        - timezone
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
