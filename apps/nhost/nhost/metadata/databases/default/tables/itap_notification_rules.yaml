table:
  schema: itap
  name: notification_rules
configuration:
  custom_name: notification_rules
object_relationships:
  - name: escalation_policy
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: escalation_policies
        column_mapping:
          organization_id: organization_id
          escalation_policy_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: recipient_group
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: recipient_groups
        column_mapping:
          organization_id: organization_id
          recipient_group_id: id
  - name: template
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_templates
        column_mapping:
          organization_id: organization_id
          template_id: id
array_relationships:
  - name: notification_rule_channels
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_rule_channels
        column_mapping:
          organization_id: organization_id
          id: rule_id
  - name: notification_rule_event_types
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_rule_event_types
        column_mapping:
          organization_id: organization_id
          id: rule_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - conditions
        - description
        - digest_mode
        - escalation_policy_id
        - is_active
        - name
        - priority
        - recipient_group_id
        - template_id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - code
        - conditions
        - created_at
        - description
        - digest_mode
        - escalation_policy_id
        - id
        - is_active
        - last_triggered_at
        - name
        - number
        - organization_id
        - priority
        - recipient_group_id
        - template_id
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - conditions
        - description
        - digest_mode
        - escalation_policy_id
        - is_active
        - name
        - priority
        - recipient_group_id
        - template_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
