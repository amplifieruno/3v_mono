table:
  schema: itap
  name: identity_photos
configuration:
  custom_name: identity_photos
object_relationships:
  - name: device
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: devices
        column_mapping:
          organization_id: organization_id
          device_id: id
  - name: file
    using:
      manual_configuration:
        remote_table:
          schema: storage
          name: files
        column_mapping:
          file_id: id
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - captured_at
        - file_id
        - identity_id
        - kind
        - quality_score
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - captured_at
        - created_at
        - device_id
        - file_id
        - id
        - identity_id
        - kind
        - organization_id
        - quality_score
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - captured_at
        - kind
        - quality_score
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
