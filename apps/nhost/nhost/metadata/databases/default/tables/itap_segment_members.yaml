table:
  schema: itap
  name: segment_members
configuration:
  custom_name: segment_members
object_relationships:
  - name: added_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          added_by: user_id
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          profile_id: id
  - name: removed_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          removed_by: user_id
  - name: segment
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: segments
        column_mapping:
          organization_id: organization_id
          segment_id: id
          target: target
computed_fields:
  - name: opened_now
    definition:
      function:
        schema: itap
        name: segment_member_opened_now
select_permissions:
  - role: org_admin
    permission:
      columns:
        - added_at
        - added_by
        - created_at
        - id
        - identity_id
        - organization_id
        - profile_id
        - removed_at
        - removed_by
        - segment_id
        - source
        - target
        - updated_at
      computed_fields:
        - opened_now
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
