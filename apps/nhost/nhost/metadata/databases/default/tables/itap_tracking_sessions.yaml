table:
  schema: itap
  name: tracking_sessions
configuration:
  custom_name: tracking_sessions
object_relationships:
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: last_access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          last_access_point_id: id
  - name: last_area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          last_area_id: id
  - name: last_location_access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          last_location_access_point_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          profile_id: id
array_relationships:
  - name: area_occupancy
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: area_occupancy
        column_mapping:
          organization_id: organization_id
          id: session_id
  - name: identity_locations
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_locations
        column_mapping:
          organization_id: organization_id
          id: session_id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - areas_visited
        - created_at
        - duration_seconds
        - ended_at
        - facility_id
        - id
        - identity_id
        - last_access_point_id
        - last_area_id
        - last_detected_at
        - last_location_access_point_id
        - opened_by_detection_id
        - organization_id
        - profile_id
        - started_at
        - status
        - updated_at
        - visit_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
