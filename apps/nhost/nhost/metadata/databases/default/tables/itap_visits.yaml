table:
  schema: itap
  name: visits
configuration:
  custom_name: visits
object_relationships:
  - name: company
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: companies
        column_mapping:
          organization_id: organization_id
          company_id: id
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: host_profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          host_profile_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: visitor_profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          visitor_profile_id: id
array_relationships:
  - name: tracking_sessions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          id: visit_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - badge_number
        - company_id
        - expected_end
        - expected_start
        - facility_id
        - host_profile_id
        - purpose
        - visitor_profile_id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - badge_number
        - cancellation_reason
        - checked_in_at
        - checked_out_at
        - code
        - company_id
        - created_at
        - expected_end
        - expected_start
        - facility_id
        - host_profile_id
        - id
        - number
        - organization_id
        - purpose
        - status
        - updated_at
        - visitor_profile_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - badge_number
        - company_id
        - expected_end
        - expected_start
        - facility_id
        - host_profile_id
        - purpose
        - visitor_profile_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
