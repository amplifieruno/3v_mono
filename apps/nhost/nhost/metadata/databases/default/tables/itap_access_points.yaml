table:
  schema: itap
  name: access_points
configuration:
  custom_name: access_points
object_relationships:
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          area_id: id
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: from_area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          from_area_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: access_point_devices
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_point_devices
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: access_point_id
  - name: detections
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: detections
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: access_point_id
  - name: events
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: events
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: access_point_id
  - name: identity_locations
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_locations
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: access_point_id
  - name: last_access_point_tracking_sessions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: last_access_point_id
  - name: tracking_sessions_by_last_location_access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: last_location_access_point_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - direction
        - facility_id
        - from_area_id
        - is_entry_exit
        - kind
        - name
        - position
        - status
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - created_at
        - direction
        - facility_id
        - from_area_id
        - id
        - is_entry_exit
        - kind
        - name
        - organization_id
        - position
        - status
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - direction
        - from_area_id
        - is_entry_exit
        - kind
        - name
        - position
        - status
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
