select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - deactivated_at
        - deactivated_by
        - department
        - expires_at
        - id
        - joined_at
        - organization_id
        - quiet_hours
        - role
        - status
        - title
        - updated_at
        - user_id
        - vacation_delegate_user_id
        - vacation_until
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - user_id
        - role
        - status
        - title
        - department
        - joined_at
        - expires_at
        - deactivated_at
        - deactivated_by
        - quiet_hours
        - vacation_until
        - vacation_delegate_user_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - department
        - expires_at
        - quiet_hours
        - role
        - status
        - title
        - vacation_delegate_user_id
        - vacation_until
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
