table:
  schema: itap
  name: organization_members
configuration:
  custom_name: organization_members
object_relationships:
  - name: deactivated_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          deactivated_by: user_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: user
    using:
      manual_configuration:
        remote_table:
          schema: auth
          name: users
        column_mapping:
          user_id: id
  - name: vacation_delegate_user
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          vacation_delegate_user_id: user_id
array_relationships:
  - name: identity_merges_by_merged_by
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_merges
        column_mapping:
          organization_id: organization_id
          user_id: merged_by
  - name: identity_merges_by_rolled_back_by
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_merges
        column_mapping:
          organization_id: organization_id
          user_id: rolled_back_by
  - name: linked_identities
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          user_id: linked_by
  - name: organization_invitations
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_invitations
        column_mapping:
          organization_id: organization_id
          user_id: invited_by
  - name: organization_members_by_deactivated_by
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          user_id: deactivated_by
  - name: organization_members_by_vacation_delegate_user
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          user_id: vacation_delegate_user_id
  - name: verification_requests_by_assigned_to
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: verification_requests
        column_mapping:
          organization_id: organization_id
          user_id: assigned_to
  - name: verification_requests_by_decided_by
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: verification_requests
        column_mapping:
          organization_id: organization_id
          user_id: decided_by
  - name: verification_requests_by_requested_by
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: verification_requests
        column_mapping:
          organization_id: organization_id
          user_id: requested_by
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - deactivated_at
        - deactivated_by
        - department
        - expires_at
        - id
        - joined_at
        - organization_id
        - quiet_hours
        - role
        - status
        - title
        - updated_at
        - user_id
        - vacation_delegate_user_id
        - vacation_until
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - user_id
        - role
        - status
        - title
        - department
        - joined_at
        - expires_at
        - deactivated_at
        - deactivated_by
        - quiet_hours
        - vacation_until
        - vacation_delegate_user_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - department
        - expires_at
        - quiet_hours
        - role
        - status
        - title
        - vacation_delegate_user_id
        - vacation_until
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
