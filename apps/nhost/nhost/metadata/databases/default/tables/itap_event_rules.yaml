table:
  schema: itap
  name: event_rules
configuration:
  custom_name: event_rules
object_relationships:
  - name: current_version
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: event_rule_versions
        column_mapping:
          organization_id: organization_id
          current_version_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: event_rule_versions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: event_rule_versions
        column_mapping:
          organization_id: organization_id
          id: rule_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - description
        - is_enabled
        - name
        - rule_type
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - code
        - created_at
        - current_version_id
        - description
        - id
        - is_enabled
        - last_triggered_at
        - name
        - number
        - organization_id
        - rule_type
        - trigger_count
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - description
        - is_enabled
        - name
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
