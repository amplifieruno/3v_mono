table:
  schema: itap
  name: organization_settings
configuration:
  custom_name: organization_settings
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - organization_id
        - recognition_threshold
        - enrollment_duplicate_threshold
        - tracking_timeout_seconds
        - archive_unknown_after_days
        - tailgating_window_seconds
        - default_retention_days
        - detection_counter_throttle_seconds
        - abnormal_movement_max_count
        - abnormal_movement_min_total
        - policy_revocation_bound_seconds
        - face_credential_cooldown_seconds
        - consent_embedding_retention_days
        - policy_epoch
        - policy_epoch_at
        - policy_urgent_epoch
        - policy_urgent_at
        - created_at
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - recognition_threshold
        - enrollment_duplicate_threshold
        - tracking_timeout_seconds
        - archive_unknown_after_days
        - tailgating_window_seconds
        - default_retention_days
        - detection_counter_throttle_seconds
        - abnormal_movement_max_count
        - abnormal_movement_min_total
        - policy_revocation_bound_seconds
        - face_credential_cooldown_seconds
        - consent_embedding_retention_days
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
event_triggers:
  - name: policy_urgent_epoch_bumped
    definition:
      enable_manual: false
      update:
        columns:
          - policy_urgent_epoch
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 60
    webhook: "{{BACKEND_URL}}/hasura/events/policy_urgent_epoch_bumped"
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
