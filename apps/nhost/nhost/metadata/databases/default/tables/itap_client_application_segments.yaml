table:
  schema: itap
  name: client_application_segments
configuration:
  custom_name: client_application_segments
object_relationships:
  - name: application
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: client_applications
        column_mapping:
          organization_id: organization_id
          application_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: segment
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: segments
        column_mapping:
          organization_id: organization_id
          segment_id: id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - application_id
        - segment_id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - application_id
        - created_at
        - id
        - organization_id
        - segment_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns: []
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
