table:
  schema: itap
  name: area_occupancy
configuration:
  custom_name: area_occupancy
object_relationships:
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          area_id: id
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: session
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          session_id: id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - created_at
        - entered_at
        - facility_id
        - id
        - identity_id
        - last_seen_at
        - organization_id
        - session_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
