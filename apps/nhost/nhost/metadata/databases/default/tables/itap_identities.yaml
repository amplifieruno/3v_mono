table:
  schema: itap
  name: identities
configuration:
  custom_name: identities
object_relationships:
  - name: identity_activity_stats
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_activity_stats
        column_mapping:
          organization_id: organization_id
          id: identity_id
  - name: linked_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          linked_by: user_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: primary_photo_file
    using:
