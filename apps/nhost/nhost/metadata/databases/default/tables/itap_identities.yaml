insert_permissions:
  - role: org_admin
    permission:
      columns:
        - attributes
        - custom_fields
        - is_primary_for_profile
        - is_synthetic
        - link_strength
        - primary_photo_file_id
        - profile_id
        - source
        - status
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - age
        - attributes
        - code
        - confidence
        - created_at
        - custom_fields
        - detection_count
        - first_seen_at
        - id
        - is_primary_for_profile
        - is_synthetic
        - last_seen_at
        - link_strength
        - linked_at
        - linked_by
        - matching_enabled
        - number
        - organization_id
        - primary_photo_file_id
        - profile_id
        - source
        - status
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - attributes
        - custom_fields
        - is_primary_for_profile
        - link_strength
        - primary_photo_file_id
        - profile_id
        - source
        - status
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
