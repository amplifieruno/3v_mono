table:
  schema: itap_results
  name: access_policy_simulations
configuration:
  custom_name: access_policy_simulations
select_permissions:
  - role: org_admin
    permission:
      columns:
        - decisions_in_period
        - denied_to_granted
        - drifted
        - evaluated
        - granted_to_denied
        - organization_id
        - period_from
        - period_to
        - policy_id
        - reason_changed
        - sampled
        - samples
        - skipped
        - unchanged
        - version_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      query_root_fields: []
      subscription_root_fields: []
      allow_aggregations: true
