table:
  schema: itap
  name: areas
configuration:
  custom_name: areas
object_relationships:
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: floor_plan
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: floor_plans
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: parent
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          parent_id: id
array_relationships:
  - name: access_points_by_area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: access_points_by_from_area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: from_area_id
  - name: area_occupancy
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: area_occupancy
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: children
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: parent_id
  - name: detections
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: detections
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: device_areas
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: device_areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: devices
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: devices
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: event_rule_version_scopes
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: event_rule_version_scopes
        column_mapping:
          organization_id: organization_id
          id: area_id
  - name: events
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: events
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: identity_locations
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_locations
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: incidents
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incidents
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: area_id
  - name: last_area_tracking_sessions
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          id: last_area_id
computed_fields:
  - name: current_occupancy
    definition:
      function:
        schema: itap
        name: area_current_occupancy
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - access_level
        - area_type
        - capacity
        - description
        - facility_id
        - loitering_threshold_seconds
        - name
        - parent_id
        - shape
        - status
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - access_level
        - area_type
        - capacity
        - created_at
        - depth
        - description
        - facility_id
        - id
        - loitering_threshold_seconds
        - name
        - organization_id
        - parent_id
        - path
        - shape
        - status
        - updated_at
      computed_fields:
        - current_occupancy
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - access_level
        - area_type
        - capacity
        - description
        - loitering_threshold_seconds
        - name
        - parent_id
        - shape
        - status
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
