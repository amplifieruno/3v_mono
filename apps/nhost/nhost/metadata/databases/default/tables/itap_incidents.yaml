          id: incident_id
  - name: incident_identities
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incident_identities
        column_mapping:
          organization_id: organization_id
          id: incident_id
  - name: incident_notes
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incident_notes
        column_mapping:
          organization_id: organization_id
          id: incident_id
  - name: notification_deliveries
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: notification_deliveries
        column_mapping:
          organization_id: organization_id
          id: incident_id
  - name: shift_handover_incidents
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: shift_handover_incidents
        column_mapping:
          organization_id: organization_id
          id: incident_id
  - name: user_notifications
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: user_notifications
        column_mapping:
          organization_id: organization_id
          id: incident_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - assigned_to
        - description
        - escalation_policy_id
        - external_ref
        - facility_id
        - severity
        - title
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
        created_by: x-hasura-user-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - acknowledged_at
        - acknowledged_by
        - area_id
        - assigned_to
        - code
        - created_at
        - created_by
        - dedup_key
        - description
        - disposition
        - escalation_policy_id
        - escalation_step
        - external_ref
        - facility_id
        - id
        - last_escalated_at
        - number
        - organization_id
        - resolution
        - resolved_at
        - resolved_by
        - severity
        - status
        - title
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - area_id
        - assigned_to
        - description
        - escalation_policy_id
        - external_ref
        - facility_id
        - severity
        - title
      filter:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - status:
              _neq: closed
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
