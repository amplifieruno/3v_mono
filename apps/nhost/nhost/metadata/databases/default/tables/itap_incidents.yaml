table:
  schema: itap
  name: incidents
configuration:
  custom_name: incidents
object_relationships:
  - name: acknowledged_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          acknowledged_by: user_id
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          area_id: id
  - name: assigned_to_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          assigned_to: user_id
  - name: created_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          created_by: user_id
  - name: escalation_policy
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: escalation_policies
        column_mapping:
          organization_id: organization_id
          escalation_policy_id: id
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: resolved_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          resolved_by: user_id
array_relationships:
  - name: incident_activities
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: incident_activities
        column_mapping:
          organization_id: organization_id
