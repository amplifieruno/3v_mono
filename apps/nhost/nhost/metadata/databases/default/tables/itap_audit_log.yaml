table:
  schema: itap
  name: audit_log
configuration:
  custom_name: audit_log
select_permissions:
  - role: org_admin
    permission:
      columns:
        - action
        - changes
        - entity
        - entity_id
        - id
        - ip
        - occurred_at
        - organization_id
        - reason
        - user_agent
        - user_id
      filter:
        _and:
          - organization_id:
              _eq: X-Hasura-Organization-Id
          - _or:
              - entity:
                  _nin:
                    - dashboards
                    - notification_subscriptions
                    - operator_workspaces
                    - saved_searches
                    - search_requests
                    - user_notifications
              - user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
