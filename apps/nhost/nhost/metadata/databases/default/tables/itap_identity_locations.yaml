table:
  schema: itap
  name: identity_locations
configuration:
  custom_name: identity_locations
object_relationships:
  - name: access_point
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: access_points
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          access_point_id: id
  - name: area
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: areas
        column_mapping:
          organization_id: organization_id
          facility_id: facility_id
          area_id: id
  - name: device
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: devices
        column_mapping:
          organization_id: organization_id
          device_id: id
  - name: facility
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: facilities
        column_mapping:
          organization_id: organization_id
          facility_id: id
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: session
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: tracking_sessions
        column_mapping:
          organization_id: organization_id
          session_id: id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - access_point_id
        - area_id
        - confidence
        - created_at
        - detection_id
        - device_id
        - facility_id
        - id
        - identity_id
        - is_estimated
        - movement_type
        - occurred_at
        - organization_id
        - position
        - session_id
        - uncertainty_m
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
