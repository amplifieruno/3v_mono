table:
  schema: itap
  name: identity_merges
configuration:
  custom_name: identity_merges
object_relationships:
  - name: inherited_profile
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: profiles
        column_mapping:
          organization_id: organization_id
          inherited_profile_id: id
  - name: merged_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          merged_by: user_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: rolled_back_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          rolled_back_by: user_id
  - name: target_identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          target_identity_id: id
array_relationships:
  - name: identity_duplicate_candidates
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_duplicate_candidates
        column_mapping:
          organization_id: organization_id
          id: merge_id
  - name: identity_merge_moves
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_merge_moves
        column_mapping:
          organization_id: organization_id
          id: merge_id
  - name: identity_merge_sources
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identity_merge_sources
        column_mapping:
          organization_id: organization_id
          id: merge_id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - id
        - inherited_primary
        - inherited_profile_id
        - merged_by
        - organization_id
        - reason
        - rolled_back_at
        - rolled_back_by
        - status
        - target_identity_id
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
