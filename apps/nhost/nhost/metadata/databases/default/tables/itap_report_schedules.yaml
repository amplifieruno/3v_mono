table:
  schema: itap
  name: report_schedules
configuration:
  custom_name: report_schedules
object_relationships:
  - name: created_by_member
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organization_members
        column_mapping:
          organization_id: organization_id
          created_by: user_id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: recipient_group
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: recipient_groups
        column_mapping:
          organization_id: organization_id
          recipient_group_id: id
  - name: template
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: report_templates
        column_mapping:
          organization_id: organization_id
          template_id: id
array_relationships:
  - name: reports
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: reports
        column_mapping:
          organization_id: organization_id
          id: schedule_id
insert_permissions:
  - role: org_admin
    permission:
      columns:
        - channel
        - cron
        - is_active
        - name
        - recipient_group_id
        - template_id
        - timezone
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: x-hasura-organization-id
        created_by: x-hasura-user-id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - channel
        - created_at
        - created_by
        - cron
        - id
        - is_active
        - last_error
        - last_failed_at
        - last_run_at
        - name
        - next_run_at
        - organization_id
        - recipient_group_id
        - template_id
        - timezone
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - channel
        - cron
        - is_active
        - name
        - recipient_group_id
        - template_id
        - timezone
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
