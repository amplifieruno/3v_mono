table:
  schema: itap
  name: identity_embeddings
configuration:
  custom_name: identity_embeddings
object_relationships:
  - name: identity
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: identities
        column_mapping:
          organization_id: organization_id
          identity_id: id
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: photo_file
    using:
      manual_configuration:
        remote_table:
          schema: storage
          name: files
        column_mapping:
          photo_file_id: id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - embedding
        - id
        - identity_id
        - is_template
        - model_version
        - organization_id
        - photo_file_id
        - quality_score
        - source_detection_id
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
delete_permissions:
  - role: org_admin
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
