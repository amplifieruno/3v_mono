select_permissions:
  - role: org_admin
    permission:
      columns:
        - id
        - name
        - slug
        - legal_name
        - logo_file_id
        - timezone
        - locale
        - status
        - created_at
        - updated_at
      filter:
        id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - logo_file_id
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
          status:
            _eq: active
      allow_aggregations: true
update_permissions:
  - role: org_admin
    permission:
      columns:
        - name
        - legal_name
        - logo_file_id
        - timezone
        - locale
      filter:
        id:
          _eq: X-Hasura-Organization-Id
      check:
        id:
          _eq: X-Hasura-Organization-Id
