table:
  schema: itap
  name: retention_runs
configuration:
  custom_name: retention_runs
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
array_relationships:
  - name: classes
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: retention_run_classes
        column_mapping:
          organization_id: organization_id
          id: run_id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - created_at
        - dry_run
        - error
        - finished_at
        - id
        - lease_expires_at
        - organization_id
        - scheduled_at
        - started_at
        - status
        - updated_at
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
