table:
  schema: itap
  name: webhook_deliveries
configuration:
  custom_name: webhook_deliveries
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: organizations
        column_mapping:
          organization_id: id
  - name: subscription
    using:
      manual_configuration:
        remote_table:
          schema: itap
          name: webhook_subscriptions
        column_mapping:
          organization_id: organization_id
          subscription_id: id
select_permissions:
  - role: org_admin
    permission:
      columns:
        - attempts
        - body
        - created_at
        - error
        - event_id
        - event_type
        - id
        - next_attempt_at
        - organization_id
        - response_code
        - sent_at
        - signature
        - status
        - subscription_id
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      allow_aggregations: true
event_triggers:
  - name: send_webhook
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 5
      interval_sec: 15
      timeout_sec: 30
    webhook: "{{BACKEND_URL}}/hasura/events/send_webhook"
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
